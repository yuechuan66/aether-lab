# Flow Tracer 插件加载配置（insert 形态）。
# 适用于未通过 bundle 安装本插件的 profile（headless spike、flowdev 等）。
# 注意：已安装 bundle 的 profile（web）不要再 --patch 本文件，会 id 冲突；
# 该场景用 profile 自带 cordis.patch.yml 覆盖 config，或直接使用安装版。
# 用法：dsh --profile headless --patch ./plugin.patch.yml "<task>"
- insert:
    - id: flow-tracer
      name: '/Users/admin/aether/aether-lab/dsh-flow-visualizer/src/index.ts'
      config:
        enabled: true
        port: 9527
        snapshotLimit: 1024
        maxBufferSize: 2000
        sensitiveFields:
          - api_key
          - token
          - password
          - authorization
